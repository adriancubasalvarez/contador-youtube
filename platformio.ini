; Dashboard YouTube (datos públicos) para tres tipos de pantalla.
; El código es el sketch de Arduino ContadorYouTube/ (se abre igual en Arduino
; IDE). El código común está en ContadorYouTube/src/; cada pantalla tiene su
; carpeta, y unas guardas #ifdef deciden qué se compila en cada versión.
;
;   pio run -e oled -t upload        ESP32 + OLED 0,96" (gadget de escritorio, ~12 €)
;   pio run -e cyd -t upload         pantalla táctil 2,8" con ESP32 integrado (~17 €)
;   pio run -e t5-epd47-s3 -t upload LilyGo T5 4.7" de tinta electrónica (~40 €)
;   pio device monitor               registro por USB

[platformio]
boards_dir = boards
src_dir = ContadorYouTube
default_envs = oled

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_flags =
	; 0: sin los avisos del núcleo (p. ej. «nvs_open failed» en el primer arranque, que es normal)
	-DCORE_DEBUG_LEVEL=0
	; portal de configuración en español
	'-DWM_STRINGS_FILE="wm_strings_es.h"'
lib_deps =
	tzapu/WiFiManager@2.0.17
	bblanchon/ArduinoJson@7.4.2

; ESP32 clásico (ESP32-WROOM-32, p. ej. Diymore NodeMCU USB-C con CH340)
; + pantalla OLED SSD1306 128x64 por I2C (SDA=GPIO21, SCL=GPIO22)
[env:oled]
platform = espressif32@6.12.0
board = esp32dev
; dos huecos de 1,9 MB: permite actualizar sin cable (tarjeta SD o página de ajustes)
board_build.partitions = min_spiffs.csv
upload_speed = 921600
lib_deps =
	${env.lib_deps}
	olikraus/U8g2@2.36.5

; "Cheap Yellow Display" 2,8" ILI9341 + táctil XPT2046 con ESP32-WROOM-32E
; integrado (p. ej. Freenove FNK0114F). Sin cables.
[env:cyd]
platform = espressif32@6.12.0
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_speed = 921600
build_flags =
	${env.build_flags}
	-DBOARD_CYD
lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX@1.2.7

; LilyGo T5 4.7" ESP32-S3 (versión normal, no la "Pro")
[env:t5-epd47-s3]
; Misma plataforma que usa LilyGo en su repositorio (Arduino-ESP32 2.0.x)
platform = espressif32@6.12.0
board = T5-ePaper-S3
upload_speed = 921600
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
lib_deps =
	${env.lib_deps}
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4
	lewisxhe/SensorLib@0.3.1
	ricmoo/QRCode@0.0.1
